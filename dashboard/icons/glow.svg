<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1535"/>
      <stop offset="1" stop-color="#06060c"/>
    </linearGradient>
    <radialGradient id="halo" cx=".42" cy=".46" r=".62">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#2563eb" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rimglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#halo)"/>
    <g stroke="#ffffff" stroke-opacity=".04" stroke-width="2">
      <line x1="16" y1="136" x2="496" y2="136"/><line x1="16" y1="216" x2="496" y2="216"/>
      <line x1="16" y1="296" x2="496" y2="296"/><line x1="16" y1="376" x2="496" y2="376"/>
    </g>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#rim)" stroke-width="5" opacity=".85" filter="url(#rimglow)"/>
  <g fill="#4b4570">
    <circle cx="112" cy="176" r="10"/><circle cx="112" cy="256" r="10"/><circle cx="112" cy="336" r="10"/>
  </g>
  <g filter="url(#glow)" stroke-linecap="round" stroke-width="32">
    <line x1="160" y1="176" x2="336" y2="176" stroke="#4ade80"/>
    <line x1="160" y1="256" x2="396" y2="256" stroke="#fb923c"/>
    <line x1="160" y1="336" x2="268" y2="336" stroke="#a78bfa"/>
  </g>
  <rect x="300" y="296" width="24" height="80" rx="7" fill="#e0f2fe" filter="url(#glow)"/>
</svg>
