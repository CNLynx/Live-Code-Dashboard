<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="win"><rect x="60" y="78" width="392" height="356" rx="34"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g filter="url(#drop)">
    <rect x="60" y="78" width="392" height="356" rx="34" fill="#0b1120"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="60" y="78" width="392" height="58" fill="#1e293b"/>
    <circle cx="102" cy="107" r="11" fill="#f87171"/><circle cx="138" cy="107" r="11" fill="#fbbf24"/><circle cx="174" cy="107" r="11" fill="#4ade80"/>
    <!-- added -->
    <rect x="60" y="158" width="392" height="50" fill="#22c55e" fill-opacity=".2"/>
    <rect x="60" y="158" width="10" height="50" fill="#22c55e"/>
    <rect x="96" y="174" width="200" height="18" rx="9" fill="#86efac"/>
    <!-- edited -->
    <rect x="60" y="218" width="392" height="50" fill="#f97316" fill-opacity=".2"/>
    <rect x="60" y="218" width="10" height="50" fill="#f97316"/>
    <rect x="96" y="234" width="96" height="18" rx="9" fill="#e2e8f0" fill-opacity=".75"/>
    <rect x="200" y="234" width="120" height="18" rx="9" fill="#fdba74"/>
    <!-- removed -->
    <rect x="60" y="278" width="392" height="50" fill="#ef4444" fill-opacity=".2"/>
    <rect x="60" y="278" width="10" height="50" fill="#ef4444"/>
    <rect x="96" y="294" width="150" height="18" rx="9" fill="#fca5a5" fill-opacity=".8"/>
    <!-- typing -->
    <rect x="96" y="354" width="130" height="18" rx="9" fill="#e2e8f0" fill-opacity=".75"/>
    <rect x="236" y="342" width="12" height="42" rx="4" fill="#38bdf8"/>
    <!-- a little chart -->
    <polyline points="300,396 330,380 356,388 384,356 412,366 432,340" fill="none" stroke="url(#spark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="432" cy="340" r="9" fill="#a78bfa"/>
  </g>
</svg>
